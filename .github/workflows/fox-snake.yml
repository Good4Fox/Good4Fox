name: FOXCORE / Contribution Engine
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution motion
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Good4Fox
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff812b&color_dots=#ebedf0,#ffdbc1,#ffb16e,#ff812b,#a93f19
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff812b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
