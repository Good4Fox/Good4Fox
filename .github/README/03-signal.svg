<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" role="img" aria-label="What Good Fox builds"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151B23"/><stop offset="1" stop-color="#0D1117"/></linearGradient><linearGradient id="sun"><stop stop-color="#FFB454"/><stop offset="1" stop-color="#FF7A18"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#30363D" stroke-width=".55" opacity=".6"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace} .pulse{animation:pulse 2.5s ease-in-out infinite} .slide{animation:slide 5s ease-in-out infinite} .cursor{animation:blink 1s step-end infinite} @keyframes pulse{50%{opacity:.25}} @keyframes slide{50%{transform:translateX(18px)}} @keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.pulse,.slide,.cursor{animation:none!important}}</style><clipPath id="foxcore-viewport"><rect width="1200" height="338" rx="20"/></clipPath></defs><g clip-path="url(#foxcore-viewport)"><rect width="100%" height="100%" rx="20" fill="url(#bg)"/><rect width="100%" height="100%" rx="20" fill="url(#grid)" opacity=".34"/><rect x="1" y="1" width="1198" height="336" rx="19" stroke="#30363D" stroke-width="1" fill="none"/><text x="43" y="50" fill="#FFB454" font-size="16" font-weight="700" class="mono">// WHAT I BUILD</text><text x="43" y="107" fill="#F0F6FC" font-size="43" font-weight="900" >SOFTWARE WITH A PULSE.</text><text x="43" y="144" fill="#9198A1" font-size="21" font-weight="400" >Engineering is the system. Experience is the differentiator.</text><rect x="39" y="180" width="360" height="130" rx="12" fill="#21262D" stroke="#30363D"/><rect x="52" y="194" width="4" height="100" rx="2" fill="#FF7A18"/><text x="68" y="217" fill="#FF7A18" font-size="15" font-weight="700" class="mono">01</text><text x="68" y="249" fill="#F0F6FC" font-size="18" font-weight="800" >AI-NATIVE WORKFLOWS</text><text x="68" y="275" fill="#9198A1" font-size="13" font-weight="400" >Multi-model tooling and useful automation</text><rect x="425" y="180" width="360" height="130" rx="12" fill="#21262D" stroke="#30363D"/><rect x="438" y="194" width="4" height="100" rx="2" fill="#FF7A18"/><text x="454" y="217" fill="#FF7A18" font-size="15" font-weight="700" class="mono">02</text><text x="454" y="249" fill="#F0F6FC" font-size="18" font-weight="800" >CLI &amp; DEVELOPER TOOLS</text><text x="454" y="275" fill="#9198A1" font-size="13" font-weight="400" >Practical power, deliberate ergonomics</text><rect x="811" y="180" width="360" height="130" rx="12" fill="#21262D" stroke="#30363D"/><rect x="824" y="194" width="4" height="100" rx="2" fill="#FF7A18"/><text x="840" y="217" fill="#FF7A18" font-size="15" font-weight="700" class="mono">03</text><text x="840" y="249" fill="#F0F6FC" font-size="18" font-weight="800" >VISUAL ENGINEERING</text><text x="840" y="275" fill="#9198A1" font-size="13" font-weight="400" >Interface craft without compromise</text></g></svg>