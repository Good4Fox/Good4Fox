<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Foxcore boot terminal"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101A2B"/><stop offset="1" stop-color="#090D15"/></linearGradient><linearGradient id="sun"><stop stop-color="#FFB85A"/><stop offset="1" stop-color="#FF5A21"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#29384A" stroke-width=".55" opacity=".6"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace} .pulse{animation:pulse 2.5s ease-in-out infinite} .slide{animation:slide 5s ease-in-out infinite} .cursor{animation:blink 1s step-end infinite} @keyframes pulse{50%{opacity:.25}} @keyframes slide{50%{transform:translateX(18px)}} @keyframes blink{50%{opacity:0}}@keyframes emblemFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} @keyframes ringRotate{to{transform:rotate(360deg)}} .emblemFloat{animation:emblemFloat 5s ease-in-out infinite} .ringRotate{animation:ringRotate 35s linear infinite;transform-origin:980px 181px} @media(prefers-reduced-motion:reduce){.emblemFloat,.ringRotate,.pulse,.slide,.cursor{animation:none!important}}</style></defs><rect width="100%" height="100%" rx="20" fill="url(#bg)"/><rect width="100%" height="100%" rx="20" fill="url(#grid)" opacity=".34"/><rect x="1" y="1" width="1198" height="298" rx="19" stroke="#35445C" stroke-width="2" fill="none"/><circle cx="45" cy="32" r="6" fill="#FB6666"/><circle cx="65" cy="32" r="6" fill="#FFCB65"/><circle cx="85" cy="32" r="6" fill="#53D99C"/><text x="110" y="38" fill="#8291A8" font-size="16" font-weight="700" class="mono">FOXCORE / EXECUTION CONSOLE</text><text x="990" y="38" fill="#53D99C" font-size="15" font-weight="700" class="mono">SESSION :: ONLINE</text><path d="M26 57L1174 57" stroke="#344258" stroke-width="1" /><text x="44" y="106" fill="#FF812B" font-size="22" font-weight="700" class="mono">&gt; fox init --profile Good4Fox</text><text x="44" y="148" fill="#F6F8FC" font-size="19" font-weight="700" class="mono">[BOOT]   DESIGN-DRIVEN ENGINEERING</text><text x="44" y="183" fill="#F6F8FC" font-size="19" font-weight="700" class="mono">[LOAD]   AI PRODUCTS / CLI / AUTOMATION</text><text x="44" y="218" fill="#53D99C" font-size="19" font-weight="700" class="mono">[READY]  FROM PROTOTYPE TO PRODUCTION</text><text x="44" y="268" fill="#FFC06B" font-size="21" font-weight="700" class="mono">&gt; building things worth using</text><rect class="cursor" x="448" y="245" width="13" height="26" fill="#FF812B"/><g opacity=".98">
