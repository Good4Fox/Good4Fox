<svg xmlns="http://www.w3.org/2000/svg" width="590" height="240" viewBox="0 0 590 240" role="img" aria-label="HUNESFOX CLI"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151B23"/><stop offset="1" stop-color="#0D1117"/></linearGradient><linearGradient id="sun"><stop stop-color="#FFB454"/><stop offset="1" stop-color="#FF7A18"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#30363D" stroke-width=".55" opacity=".6"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace} .pulse{animation:pulse 2.5s ease-in-out infinite} .slide{animation:slide 5s ease-in-out infinite} .cursor{animation:blink 1s step-end infinite} @keyframes pulse{50%{opacity:.25}} @keyframes slide{50%{transform:translateX(18px)}} @keyframes blink{50%{opacity:0}}@keyframes softGlow{0%,100%{opacity:.35}50%{opacity:.85}} @keyframes drawDash{to{stroke-dashoffset:-100}} .softGlow{animation:softGlow 3s ease-in-out infinite} .drawDash{animation:drawDash 8s linear infinite} @media(prefers-reduced-motion:reduce){.softGlow,.drawDash,.pulse,.slide,.cursor{animation:none!important}}</style><clipPath id="foxcore-viewport"><rect width="590" height="240" rx="20"/></clipPath></defs><g clip-path="url(#foxcore-viewport)"><rect width="100%" height="100%" rx="20" fill="url(#bg)"/><rect width="100%" height="100%" rx="20" fill="url(#grid)" opacity=".34"/><rect x="1" y="1" width="588" height="238" rx="19" stroke="#30363D" stroke-width="1" fill="none"/><circle cx="488" cy="119" r="92" fill="#FF7A18" filter="url(#glow)" opacity=".055"/><text x="33" y="40" fill="#FFB454" font-size="15" font-weight="700" class="mono">FOXCORE / BUILD A</text><text x="33" y="82" fill="#9198A1" font-size="15" font-weight="700" class="mono">PRIMARY PROJECT</text><text x="33" y="135" fill="#F0F6FC" font-size="40" font-weight="900" >HUNESFOX CLI</text><text x="33" y="165" fill="#9198A1" font-size="15" font-weight="400" >AI-first CLI / multi-model workflows</text><rect x="31" y="185" width="215" height="28" rx="5" fill="#FF7A18"/><text x="44" y="204" fill="#0D1117" font-size="13" font-weight="800" class="mono">NPM  /  PRODUCT</text><!-- miniature real terminal: command execution and model routing -->
